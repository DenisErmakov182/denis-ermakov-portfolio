<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Режим докладчика</title>
  <meta name="robots" content="noindex">
  <link rel="stylesheet" href="assets/fonts/manrope.css">
  <style>
    :root {
      --page: #121212;
      --panel: #1e1e1e;
      --ink: #e8e8e8;
      --dim: rgba(232, 232, 232, 0.5);
      --accent: #2971fe;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; }
    body {
      background: var(--page);
      color: var(--ink);
      font-family: 'Manrope', system-ui, sans-serif;
      font-weight: 500;
      display: grid;
      grid-template-rows: auto 1fr auto;
      gap: 16px;
      padding: 16px;
      overflow: hidden;
    }
    button {
      font: inherit;
      color: inherit;
      border: 0;
      border-radius: 10px;
      background: #2a2a2a;
      padding: 8px 14px;
      cursor: pointer;
    }
    button:hover { background: #353535; }
    button.is-active { background: var(--accent); color: #fff; }

    /* ── Top bar ── */
    .bar { display: flex; align-items: center; gap: 16px; }
    .timer { font-size: 32px; font-weight: 700; font-variant-numeric: tabular-nums; min-width: 120px; }
    .clock { color: var(--dim); font-variant-numeric: tabular-nums; }
    .spacer { flex: 1; }
    .status { color: var(--dim); }
    .status.is-off { color: #f3595e; }

    /* ── Main area ── */
    .main { display: grid; grid-template-columns: 1.7fr 1fr; gap: 16px; min-height: 0; }
    .col { display: flex; flex-direction: column; gap: 12px; min-height: 0; }
    .label { font-size: 13px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--dim); }
    .screen {
      position: relative;
      width: 100%;
      aspect-ratio: 16 / 9;
      border-radius: 14px;
      overflow: hidden;
      background: #000;
    }
    .screen iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; pointer-events: none; }
    .screen.is-current { outline: 3px solid var(--accent); }
    .notes {
      flex: 1;
      min-height: 0;
      overflow: auto;
      padding: 18px 20px;
      border-radius: 14px;
      background: var(--panel);
      font-size: 20px;
      line-height: 1.45;
    }
    .notes h3 { margin: 0 0 10px; font-size: 22px; }
    .notes ul { margin: 0; padding-left: 22px; display: flex; flex-direction: column; gap: 8px; }
    .notes b { color: #fff; }

    /* ── Cheat sheet ── */
    .tabs2 { display: flex; align-items: center; gap: 8px; }
    .tabs2 .hint { margin-left: auto; font-size: 13px; color: var(--dim); }
    .cheat { flex: 1; min-height: 0; display: flex; flex-direction: column; gap: 10px; border-radius: 14px; background: var(--panel); padding: 14px; }
    .cheat[hidden] { display: none; }
    body.cheat-on .main { grid-template-columns: 1fr 1.25fr; }
    body.cheat-on .main > .col:nth-child(2) > .label,
    body.cheat-on .main > .col:nth-child(2) > .screen { display: none; }
    .cheat-search { width: 100%; padding: 10px 14px; border: 0; border-radius: 10px; background: #2a2a2a; color: var(--ink); font: inherit; font-size: 17px; outline: 2px solid transparent; }
    .cheat-search:focus { outline-color: var(--accent); }
    .chips { display: flex; flex-wrap: wrap; gap: 6px; }
    .chips button { padding: 6px 12px; font-size: 15px; border-radius: 999px; }
    .chips button span { opacity: 0.6; margin-left: 4px; }
    .cheat-list { flex: 1; min-height: 0; overflow: auto; display: flex; flex-direction: column; gap: 8px; padding-right: 2px; }
    .cheat-h { font-size: 13px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--dim); margin: 4px 0 0; }
    .card { border-radius: 12px; background: #262626; padding: 12px 14px; cursor: pointer; }
    .card:hover { background: #2d2d2d; }
    .card .q { font-size: 17px; font-weight: 700; color: #fff; line-height: 1.3; }
    .card .a { margin-top: 4px; font-size: 16px; line-height: 1.4; color: rgba(255, 255, 255, 0.82); }
    .card .nums { margin: 8px 0 0; padding-left: 20px; font-size: 15.5px; line-height: 1.4; color: #9dbbff; display: flex; flex-direction: column; gap: 3px; }
    .card .more { display: none; margin-top: 10px; padding-top: 10px; border-top: 1px solid rgba(255, 255, 255, 0.1); font-size: 16px; line-height: 1.5; color: var(--ink); }
    .card.open .more { display: block; }
    .card .more > div { white-space: pre-line; }
    .card .nope { margin-top: 8px; color: #f3a05e; font-size: 15px; }
    .card .todo { margin-top: 6px; color: #e8d36a; font-size: 15px; }
    .card .tag .warn { color: #e8d36a; font-weight: 700; }
    .card .tag { float: right; margin: 0 0 0 8px; font-size: 12px; color: var(--dim); }
    .empty { color: var(--dim); padding: 12px 4px; }

    /* ── Bottom navigation ── */
    .nav { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    .nav .counter { color: var(--dim); min-width: 64px; text-align: center; font-variant-numeric: tabular-nums; }
  </style>
</head>
<body>

<div class="bar">
  <span class="timer" id="timer">00:00</span>
  <button id="timer-toggle">Старт</button>
  <button id="timer-reset">Сброс</button>
  <span class="clock" id="clock"></span>
  <span class="spacer"></span>
  <span class="status is-off" id="status">Откройте презентацию в соседней вкладке или окне</span>
</div>

<div class="main">
  <div class="col">
    <span class="label">Сейчас на экране у собеседников</span>
    <div class="screen is-current"><iframe src="./?mirror" title="Текущий слайд"></iframe></div>
  </div>
  <div class="col">
    <span class="label">Следующий слайд</span>
    <div class="screen"><iframe src="./?mirror&offset=1" title="Следующий слайд"></iframe></div>
    <div class="tabs2">
      <button id="tab-notes" class="is-active">Заметки</button>
      <button id="tab-cheat">Шпаргалка</button>
      <span class="hint">/ — поиск · Esc — назад к заметкам</span>
    </div>
    <div class="notes" id="notes"></div>
    <div class="cheat" id="cheat" hidden>
      <input class="cheat-search" id="cheat-search" type="search" placeholder="Поиск: слово, цифра, вопрос…" autocomplete="off">
      <div class="chips" id="chips"></div>
      <div class="cheat-list" id="cheat-list"></div>
    </div>
  </div>
</div>

<div class="nav">
  <button data-go="home">Главная</button>
  <button data-section="career">Карьера</button>
  <button data-section="projects">Pet-projects</button>
  <button data-section="test">Тестовое</button>
  <button data-section="about">Обо мне</button>
  <span class="spacer"></span>
  <button id="prev">← Назад</button>
  <span class="counter" id="counter">— / —</span>
  <button id="next">Вперёд →</button>
</div>

<script src="assets/cheatsheet.js"></script>
<script>
  // Talking points per slide (data-id in index.html)
  const NOTES = {
    cover: {
      title: 'Главная',
      points: [
        '<b>Расскажи о себе (≈45 сек).</b> Меня зовут Денис Ермаков. Я вырос из графического дизайна в интерфейсный и продуктовый: четыре года в дизайне, из них три в интерфейсах <span style="color:#e8d36a">(сверь цифру с резюме и сообщением Артёму)</span>. Сейчас работаю в Коалиции, это онлайн-школа и платформа для ЕГЭ и ОГЭ: развиваю кабинеты и админку и делаю AI-конспект видео для преподавателей. Параллельно сам довожу до прода два продукта: в Mappy 40% протестировавших возвращаются каждую неделю, в ГПтест 20 активных пользователей. Идеи, исследования, дизайн и проверку делаю сам, ИИ ускоряет сборку. Учусь на третьем курсе бизнес-информатики, чтобы лучше понимать продукт и бизнес. К вам хочу за тем, чего мне не хватает: исследования на большой аудитории и A/B.',
        '<b>Не говорить:</b> «постоянно учусь», «подтянуть слабую сторону», «ИИ сделал продукты».',
        '4 раздела — идти за разговором, а не по порядку. Клавиши 1–4 — разделы, 0 — главная.',
        'Спросят про тестовое → сразу вкладка «Тестовое».'
      ]
    },
    career: {
      title: 'Карьера · что делаю на работе',
      points: [
        '<b>Что на слайде.</b> Слева «Интерфейсы» (редактор урока, блок «Видео»), справа «Графические материалы» (сторис вебинара, баннер «Интенсивы ЕГЭ»).',
        '<b>Платформа.</b> Проект Коалиции с Министерством образования Москвы <span style="color:#e8d36a">(проверь название и можно ли называть)</span>. Две части: публичная (кабинеты учеников и учителей) и админка Matetech (курсы, роли). Поставляется разным школам, решения под школы немного различаются.',
        '<b>Путь.</b> Графика (2022) → интерфейсы (с 2023) → с конца 2024 глубокие интервью и usability-тесты. Команда: 3 дизайнера и лид. Помимо интерфейсов — креативы и презентации.',
        '<b>Ритм.</b> Созвон в 10:30, спринты по 2 недели, канбан, бэклог, чекворк раз в 2 недели, квартальное планирование.',
        '<b>Процесс.</b> У заказчиков свои продакты, задачи приходят со спекой — ресёрч не везде; глубже там, где получается (AI-конспект) и в своих продуктах. Не звучать пассивно: принимаю задачи и прорабатываю сценарии, состояния, детали.',
        '<b>Кейс AI-конспекта (если спросят).</b> Проблема: преподаватели долго заполняют карточку видео. Моя часть: созвоны, путь загрузки, экраны и состояния, тест на преподавателях. Результат: пилот на 10 → прод; время сократилось (цифр нет). Подробности — шпаргалка, тема «AI-конспект».',
        '<b>Могут спросить:</b> формат работы, сколько продуктового опыта, почему мало исследований, интерфейсы, графика, AI-конспект. Всё в «★ Этот слайд» в шпаргалке.'
      ]
    },
    pipeline: {
      title: 'Pet-projects · как я делаю продукты',
      points: [
        'Один путь для обоих продуктов: своя боль → ресёрч → прототип → проверка на людях → прод.',
        'Mappy: 4 интервью + опрос 57 → карточка места → 2 итерации → 40% возвращаются еженедельно.',
        'ГПтест: опрос 127 → MVP за месяц → 3 итерации (тест на 20, 3,5 из 5; 4 интервью) → 20 активных.',
        'Сквозная мысль: сам довожу идею до прода и меряю результат — в том числе в коде.'
      ]
    },
    mappy: {
      title: 'Mappy',
      points: [
        'Проблема: 61% забывают название места, 53% теряют сохранённые ссылки и скриншоты (опрос, 49 ответов на этот вопрос).',
        '4 интервью + опрос на 57 человек.',
        'Заметки личные и общие — общие видят друзья.',
        '40% протестировавших возвращались каждую неделю.',
        'Видео идёт фоном, не ждать.'
      ]
    },
    gptest: {
      title: 'ГПтест',
      points: [
        'Своя боль → опрос 127: 31% не находят тест по нужной теме, у 39% вопросы плохого качества, 39% не хватает объяснения ошибок; 60% уже проверяют знания через ChatGPT.',
        'Черновой прототип за неделю → тест на 20 (3,5 из 5) → 4 интервью → прод.',
        '20 активных, 5–6 сессий в неделю.',
        'Иначе: начал бы с интервью, а не только с опроса.'
      ]
    },
    about: {
      title: 'Обо мне',
      points: [
        'Бизнес-информатика — чтобы понимать, как устроен бизнес.',
        'Хочу в большой продукт — видеть, как дизайн влияет на бизнес.',
        'MVP с AI; эта презентация свёрстана мной в коде.',
        'Кино и коллекция фигурок.'
      ]
    },
    'test-task': {
      title: 'Тестовое · задача и решение',
      points: [
        'Проблема: экран одинаков для всех, ничего не помнит.',
        'Решение: адаптивный верхний блок — новичку масштаб рынка и «Указать пожелания», активному — данные по прошлым откликам.',
        'Справа: слева старый экран, справа новый для новичка.',
        'Резюме, отклики и кабинет вынесены вниз отдельным таббаром: основные кнопки не скроллятся, важное под рукой.'
      ]
    },
    'test-screens': {
      title: 'Тестовое · Новичок и Активный',
      points: [
        'Один экран, два состояния — по цифрам на экранах.',
        'Новичок: фильтры пустые, наверху масштаб рынка и «Указать пожелания», категории с деньгами.',
        'Активный: сохранён поиск, наверху статус откликов — «2 работодателя ответили», категории под поиск.'
      ]
    },
    'test-research': {
      title: 'Тестовое · ресёрч',
      points: [
        'Аудит: не хватает памяти и свежести.',
        'Масс-профессии и транспорт — больше 60% аудитории.',
        'Опрос маленький (3 человека) — сигнал, не доказательство.'
      ]
    },
    'test-hypotheses': {
      title: 'Тестовое · гипотезы и метрики',
      points: [
        'Гипотеза 1, новичок: масштаб рынка и категории со ставкой → Activation Rate (доля новичков с откликом за 24 часа).',
        'Гипотеза 2, активный: сохранённый поиск + новое + статус откликов → TTFA (медианное время до первого полезного тапа: открыть вакансию, продолжить прошлый поиск или проверить статус откликов).',
        'Проверка: прототип на 5 людях → A/B по возвратам.',
        'С реальными данными первым проверил бы, какой сегмент больше.'
      ]
    }
  };

  const sync = new BroadcastChannel('deck-sync');
  const statusEl = document.getElementById('status');
  const notesEl = document.getElementById('notes');
  const counter = document.getElementById('counter');
  let state = null;

  function goto(i) { sync.postMessage({ type: 'goto', i }); }

  sync.addEventListener('message', e => {
    if (e.data.type !== 'state') return;
    state = e.data;
    statusEl.textContent = 'Связь с презентацией есть';
    statusEl.classList.remove('is-off');
    counter.textContent = `${state.i + 1} / ${state.n}`;
    renderCheat();
    const note = NOTES[state.id];
    notesEl.innerHTML = note
      ? `<h3>${note.title}</h3><ul>${note.points.map(p => `<li>${p}</li>`).join('')}</ul>`
      : '';
    document.querySelectorAll('[data-section]').forEach(b => b.classList.toggle('is-active', b.dataset.section === state.section));
  });
  sync.postMessage({ type: 'hello' });

  // Section jumps: the deck resolves the first slide of the section itself
  document.querySelectorAll('[data-section]').forEach(b =>
    b.addEventListener('click', () => sync.postMessage({ type: 'section', section: b.dataset.section })));
  document.querySelector('[data-go="home"]').addEventListener('click', () => goto(0));
  document.getElementById('prev').addEventListener('click', () => state && goto(state.i - 1));
  document.getElementById('next').addEventListener('click', () => state && goto(state.i + 1));

  // ── Cheat sheet ──
  const cheatEl = document.getElementById('cheat');
  const searchEl = document.getElementById('cheat-search');
  const chipsEl = document.getElementById('chips');
  const listEl = document.getElementById('cheat-list');
  const tabNotes = document.getElementById('tab-notes');
  const tabCheat = document.getElementById('tab-cheat');
  const STAR = '★ Этот слайд';
  const WARN = '⚠ Проверить';
  let topic = STAR;
  const open = new Set();
  const esc = s => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;');

  function showCheat(on, focus) {
    document.body.classList.toggle('cheat-on', on);
    cheatEl.hidden = !on;
    notesEl.hidden = on;
    tabCheat.classList.toggle('is-active', on);
    tabNotes.classList.toggle('is-active', !on);
    if (on) { renderCheat(); if (focus) { searchEl.focus(); searchEl.select(); } }
    else searchEl.blur();
  }
  tabNotes.addEventListener('click', () => showCheat(false));
  tabCheat.addEventListener('click', () => showCheat(true));

  function cardHTML(c) {
    return `<div class="card${open.has(c.id) ? ' open' : ''}" data-id="${c.id}">
      <span class="tag">${c.todo ? '<b class="warn">⚠ проверить</b> · ' : ''}${c.topic}</span>
      <div class="q">${esc(c.q)}</div>
      <div class="a">${esc(c.a)}</div>
      ${c.nums ? `<ul class="nums">${c.nums.map(n => `<li>${esc(n)}</li>`).join('')}</ul>` : ''}
      <div class="more">
        ${c.full ? `<div>${esc(c.full)}</div>` : ''}
        ${c.nope ? `<div class="nope">✗ Не говорить: ${esc(c.nope)}</div>` : ''}
        ${c.todo ? `<div class="todo">⚠ Проверить: ${esc(c.todo)}</div>` : ''}
      </div>
    </div>`;
  }

  function renderCheat() {
    if (cheatEl.hidden) return;
    const q = searchEl.value.trim().toLowerCase();
    const cur = state && state.id;
    const rank = (window.CHEAT_RANK && window.CHEAT_RANK[cur]) || [];
    const starred = window.CHEAT.filter(c => cur && c.slides && c.slides.includes(cur))
      .sort((a, b) => { const ia = rank.indexOf(a.id), ib = rank.indexOf(b.id); return (ia < 0 ? 99 : ia) - (ib < 0 ? 99 : ib); });
    const topics = [STAR, WARN, ...window.CHEAT_TOPICS];
    chipsEl.innerHTML = topics.map(t => {
      const n = t === STAR ? starred.length : t === WARN ? window.CHEAT.filter(c => c.todo).length : window.CHEAT.filter(c => c.topic === t).length;
      return `<button data-topic="${t}" class="${!q && t === topic ? 'is-active' : ''}">${t}<span>${n}</span></button>`;
    }).join('');
    let items;
    if (q) {
      items = window.CHEAT.filter(c => [c.q, c.a, (c.nums || []).join(' '), c.full || '', c.topic, c.todo || ''].join(' ').toLowerCase().includes(q));
      listEl.innerHTML = items.length ? `<div class="cheat-h">Найдено: ${items.length}</div>` + items.map(cardHTML).join('') : '<div class="empty">Ничего не найдено</div>';
    } else if (topic === STAR) {
      items = starred;
      listEl.innerHTML = items.length
        ? `<div class="cheat-h">Связанные вопросы</div>` + items.map(cardHTML).join('')
        : '<div class="empty">К этому слайду нет карточек. Выбери тему выше.</div>';
    } else if (topic === WARN) {
      items = window.CHEAT.filter(c => c.todo);
      listEl.innerHTML = `<div class="cheat-h">Карточки, где нужно проверить или дополнить</div>` + items.map(cardHTML).join('');
    } else {
      items = window.CHEAT.filter(c => c.topic === topic);
      listEl.innerHTML = items.map(cardHTML).join('');
    }
  }
  chipsEl.addEventListener('click', e => {
    const b = e.target.closest('button'); if (!b) return;
    topic = b.dataset.topic; searchEl.value = ''; renderCheat(); listEl.scrollTop = 0;
  });
  searchEl.addEventListener('input', () => { renderCheat(); listEl.scrollTop = 0; });
  listEl.addEventListener('click', e => {
    const card = e.target.closest('.card'); if (!card) return;
    const id = card.dataset.id;
    open.has(id) ? open.delete(id) : open.add(id);
    card.classList.toggle('open');
  });

  document.addEventListener('keydown', e => {
    const typing = e.target === searchEl;
    if (e.key === 'Escape') { if (!cheatEl.hidden) { showCheat(false); e.preventDefault(); } return; }
    if (typing) return;
    if (e.key === '/' || e.key === '.' ) { e.preventDefault(); showCheat(true, true); return; }
    if (!state) return;
    const k = e.key.toLowerCase();
    if (['arrowright', 'pagedown', ' '].includes(k)) { e.preventDefault(); goto(state.i + 1); }
    else if (['arrowleft', 'pageup'].includes(k)) { e.preventDefault(); goto(state.i - 1); }
    else if (k === 'h' || k === 'р' || k === 'home') goto(0);
  });

  // Timer and clock
  const timerEl = document.getElementById('timer');
  const toggle = document.getElementById('timer-toggle');
  let started = null, elapsed = 0;
  const fmt = ms => {
    const t = Math.floor(ms / 1000);
    return `${String(Math.floor(t / 60)).padStart(2, '0')}:${String(t % 60).padStart(2, '0')}`;
  };
  toggle.addEventListener('click', () => {
    if (started) { elapsed += Date.now() - started; started = null; toggle.textContent = 'Старт'; }
    else { started = Date.now(); toggle.textContent = 'Пауза'; }
  });
  document.getElementById('timer-reset').addEventListener('click', () => {
    elapsed = 0; started = started ? Date.now() : null;
  });
  setInterval(() => {
    timerEl.textContent = fmt(elapsed + (started ? Date.now() - started : 0));
    document.getElementById('clock').textContent = new Date().toLocaleTimeString('ru-RU', { hour: '2-digit', minute: '2-digit' });
  }, 250);
</script>
</body>
</html>
