<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Режим докладчика</title>
  <meta name="robots" content="noindex">
  <link rel="stylesheet" href="assets/fonts/manrope.css">
  <style>
    :root {
      --page: #121212;
      --panel: #1e1e1e;
      --ink: #e8e8e8;
      --dim: rgba(232, 232, 232, 0.5);
      --accent: #2971fe;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; }
    body {
      background: var(--page);
      color: var(--ink);
      font-family: 'Manrope', system-ui, sans-serif;
      font-weight: 500;
      display: grid;
      grid-template-rows: auto 1fr auto;
      gap: 16px;
      padding: 16px;
      overflow: hidden;
    }
    button {
      font: inherit;
      color: inherit;
      border: 0;
      border-radius: 10px;
      background: #2a2a2a;
      padding: 8px 14px;
      cursor: pointer;
    }
    button:hover { background: #353535; }
    button.is-active { background: var(--accent); color: #fff; }

    /* ── Top bar ── */
    .bar { display: flex; align-items: center; gap: 16px; }
    .timer { font-size: 32px; font-weight: 700; font-variant-numeric: tabular-nums; min-width: 120px; }
    .clock { color: var(--dim); font-variant-numeric: tabular-nums; }
    .spacer { flex: 1; }
    .status { color: var(--dim); }
    .status.is-off { color: #f3595e; }

    /* ── Main area ── */
    .main { display: grid; grid-template-columns: 1.7fr 1fr; gap: 16px; min-height: 0; }
    .col { display: flex; flex-direction: column; gap: 12px; min-height: 0; }
    .label { font-size: 13px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--dim); }
    .screen {
      position: relative;
      width: 100%;
      aspect-ratio: 16 / 9;
      border-radius: 14px;
      overflow: hidden;
      background: #000;
    }
    .screen iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; pointer-events: none; }
    .screen.is-current { outline: 3px solid var(--accent); }
    .notes {
      flex: 1;
      min-height: 0;
      overflow: auto;
      padding: 18px 20px;
      border-radius: 14px;
      background: var(--panel);
      font-size: 20px;
      line-height: 1.45;
    }
    .notes h3 { margin: 0 0 10px; font-size: 22px; }
    .notes ul { margin: 0; padding-left: 22px; display: flex; flex-direction: column; gap: 8px; }
    .notes b { color: #fff; }

    /* ── Bottom navigation ── */
    .nav { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    .nav .counter { color: var(--dim); min-width: 64px; text-align: center; font-variant-numeric: tabular-nums; }
  </style>
</head>
<body>

<div class="bar">
  <span class="timer" id="timer">00:00</span>
  <button id="timer-toggle">Старт</button>
  <button id="timer-reset">Сброс</button>
  <span class="clock" id="clock"></span>
  <span class="spacer"></span>
  <span class="status is-off" id="status">Откройте презентацию в соседней вкладке или окне</span>
</div>

<div class="main">
  <div class="col">
    <span class="label">Сейчас на экране у собеседников</span>
    <div class="screen is-current"><iframe src="./?mirror" title="Текущий слайд"></iframe></div>
  </div>
  <div class="col">
    <span class="label">Следующий слайд</span>
    <div class="screen"><iframe src="./?mirror&offset=1" title="Следующий слайд"></iframe></div>
    <span class="label">Заметки — видишь только ты</span>
    <div class="notes" id="notes"></div>
  </div>
</div>

<div class="nav">
  <button data-go="home">Главная</button>
  <button data-section="career">Карьера</button>
  <button data-section="projects">Pet-projects</button>
  <button data-section="test">Тестовое</button>
  <button data-section="about">Обо мне</button>
  <span class="spacer"></span>
  <button id="prev">← Назад</button>
  <span class="counter" id="counter">— / —</span>
  <button id="next">Вперёд →</button>
</div>

<script>
  // Talking points per slide (data-id in index.html)
  const NOTES = {
    cover: {
      title: 'Главная',
      points: [
        '3 года в EdTech, из них полтора — в интерфейсах; 2 своих продукта в проде.',
        '4 раздела — идти за разговором, а не по порядку. Клавиши 1–4 — разделы, 0 — главная.',
        'Спросят про тестовое → сразу вкладка «Тестовое».'
      ]
    },
    career: {
      title: 'Карьера · Коалиция',
      points: [
        'Путь: графика → интерфейсы. Сейчас ЛК и админки, команда — 3 дизайнера и лид.',
        'Процесс: запрос от школ → ресёрч → макеты → демо команде → показ заказчику.',
        'Дальше — AI-конспект (следующий слайд): это самый важный кейс.'
      ]
    },
    'ai-case': {
      title: 'Карьера · AI-конспект видео',
      points: [
        'Проблема: преподаватели тратят много времени на заполнение карточки видеоконтента и не успевают заниматься контентом и проверкой домашек. Расшифровку и конспект собирали вручную в сторонних сервисах.',
        'Ресёрч: жалобы от менеджера + мои созвоны с преподавателями.',
        'Моя часть: путь загрузки, экраны, состояния, ошибки.',
        'Где AI: расшифровка → таймкоды → конспект. AI ничего не публикует сам.',
        'Результат: пилот на 10 → общий прод. Метрик нет — мерил бы время от загрузки до публикации.',
        'Шаги переключаются сами; можно кликнуть на любой.'
      ]
    },
    pipeline: {
      title: 'Pet-projects · как я делаю продукты',
      points: [
        'Один путь для обоих продуктов: своя боль → ресёрч → прототип → проверка на людях → прод.',
        'Mappy: 4 интервью + опрос 57 → карточка места → 2 итерации → 40% возвращаются еженедельно.',
        'ГПтест: опрос 127 → MVP за месяц → 3 итерации (тест на 20, 3,5 из 5; 4 интервью) → 20 активных.',
        'Сквозная мысль: сам довожу идею до прода и меряю результат — в том числе в коде.'
      ]
    },
    mappy: {
      title: 'Mappy',
      points: [
        'Проблема: 61% забывают название места, 53% теряют сохранённые ссылки и скриншоты (опрос, 49 ответов на этот вопрос).',
        '4 интервью + опрос на 57 человек.',
        'Заметки личные и общие — общие видят друзья.',
        '40% протестировавших возвращались каждую неделю.',
        'Видео идёт фоном, не ждать.'
      ]
    },
    gptest: {
      title: 'ГПтест',
      points: [
        'Своя боль → опрос 127: 31% не находят тест по нужной теме, у 39% вопросы плохого качества, 39% не хватает объяснения ошибок; 60% уже проверяют знания через ChatGPT.',
        'Черновой прототип за неделю → тест на 20 (3,5 из 5) → 4 интервью → прод.',
        '20 активных, 5–6 сессий в неделю.',
        'Иначе: начал бы с интервью, а не только с опроса.'
      ]
    },
    about: {
      title: 'Обо мне',
      points: [
        'Бизнес-информатика — чтобы понимать, как устроен бизнес.',
        'Хочу в большой продукт — видеть, как дизайн влияет на бизнес.',
        'MVP с AI; эта презентация свёрстана мной в коде.',
        'Кино и коллекция фигурок.'
      ]
    },
    'test-task': {
      title: 'Тестовое · задача и решение',
      points: [
        'Проблема: экран одинаков для всех, ничего не помнит.',
        'Решение: адаптивный верхний блок — новичку масштаб рынка и «Указать пожелания», активному — данные по прошлым откликам.',
        'Справа: слева старый экран, справа новый для новичка.',
        'Резюме, отклики и кабинет вынесены вниз отдельным таббаром: основные кнопки не скроллятся, важное под рукой.'
      ]
    },
    'test-screens': {
      title: 'Тестовое · Новичок и Активный',
      points: [
        'Один экран, два состояния — по цифрам на экранах.',
        'Новичок: фильтры пустые, наверху масштаб рынка и «Указать пожелания», категории с деньгами.',
        'Активный: сохранён поиск, наверху статус откликов — «2 работодателя ответили», категории под поиск.',
        'Это единственное место, где виден «Активный» — в прототипе он не кликается.'
      ]
    },
    'test-why': {
      title: 'Тестовое · почему такие решения',
      points: [
        'Подстраиваем под человека: в ТЗ новичок и «ищущий месяцами» названы отдельно, а респонденты: 3 из 3 — первое действие у каждого своё.',
        'Данные по откликам: статус размазан по чату, сообщениям и кабинету (3 из 3); 34% соискателей вообще не получают статус заявки (отраслевая цифра 2023).',
        'Фильтры не сбрасываются: путь до них 3 шага (сердечко → подписки → фильтры), 2 из 3 ищут мимо главной.',
        'Новичку масштаб рынка: 1,5+ млн вакансий и 17,4 млн MAU у категории (click.ru, фев 2026).',
        'Категории с ценой: масс-профессии — 10,5 из 17,4 млн MAU; сегменты частично пересекаются.',
        'Таббар: основные кнопки не скроллятся и всегда под рукой; у Работа.ру «Отклики» тоже в нижнем меню; у нас статус ищут в трёх местах.',
        'Выборка маленькая (3 человека, все офисные) — сигнал, а не доказательство; дальше прототип на 5 и A/B.'
      ]
    },
    'test-research': {
      title: 'Тестовое · ресёрч',
      points: [
        'Аудит: не хватает памяти и свежести.',
        'Масс-профессии и транспорт — больше 60% аудитории.',
        'Опрос маленький (3 человека) — сигнал, не доказательство.'
      ]
    },
    'about-learn': {
      title: 'Обо мне · чему хочу научиться',
      points: [
        'Иду по тому, как устроена работа в Авито: исследования, A/B, дизайн-система, ревью, продуктовая команда.',
        'Исследования: интервью и опросы в своих продуктах есть, хочу на большой аудитории и по регулярному процессу.',
        'A/B и метрики — честно: пробел. Метрики выбирал, A/B-эксперимент в проде не запускал.',
        'Дизайн-система: UI kit и свои компоненты с токенами; хочу развивать большую систему в команде.',
        'Визуал и ревью: хочу регулярные разборы и насмотренность.',
        'Закрыть: это то, чего не даст работа в одиночку — потому и буткемп.'
      ]
    },
    'test-hypotheses': {
      title: 'Тестовое · гипотезы и метрики',
      points: [
        'Новичок → Activation Rate (отклик за 24 часа).',
        'Активный → Return Rate D7, опережающий сигнал — TTFA.',
        'Проверка: прототип на 5 людях → A/B по возвратам.',
        'С реальными данными первым проверил бы, какой сегмент больше.'
      ]
    }
  };

  const sync = new BroadcastChannel('deck-sync');
  const statusEl = document.getElementById('status');
  const notesEl = document.getElementById('notes');
  const counter = document.getElementById('counter');
  let state = null;

  function goto(i) { sync.postMessage({ type: 'goto', i }); }

  sync.addEventListener('message', e => {
    if (e.data.type !== 'state') return;
    state = e.data;
    statusEl.textContent = 'Связь с презентацией есть';
    statusEl.classList.remove('is-off');
    counter.textContent = `${state.i + 1} / ${state.n}`;
    const note = NOTES[state.id];
    notesEl.innerHTML = note
      ? `<h3>${note.title}</h3><ul>${note.points.map(p => `<li>${p}</li>`).join('')}</ul>`
      : '';
    document.querySelectorAll('[data-section]').forEach(b => b.classList.toggle('is-active', b.dataset.section === state.section));
  });
  sync.postMessage({ type: 'hello' });

  // Section jumps: the deck resolves the first slide of the section itself
  document.querySelectorAll('[data-section]').forEach(b =>
    b.addEventListener('click', () => sync.postMessage({ type: 'section', section: b.dataset.section })));
  document.querySelector('[data-go="home"]').addEventListener('click', () => goto(0));
  document.getElementById('prev').addEventListener('click', () => state && goto(state.i - 1));
  document.getElementById('next').addEventListener('click', () => state && goto(state.i + 1));

  document.addEventListener('keydown', e => {
    if (!state) return;
    const k = e.key.toLowerCase();
    if (['arrowright', 'pagedown', ' '].includes(k)) { e.preventDefault(); goto(state.i + 1); }
    else if (['arrowleft', 'pageup'].includes(k)) { e.preventDefault(); goto(state.i - 1); }
    else if (k === 'h' || k === 'р' || k === 'home') goto(0);
  });

  // Timer and clock
  const timerEl = document.getElementById('timer');
  const toggle = document.getElementById('timer-toggle');
  let started = null, elapsed = 0;
  const fmt = ms => {
    const t = Math.floor(ms / 1000);
    return `${String(Math.floor(t / 60)).padStart(2, '0')}:${String(t % 60).padStart(2, '0')}`;
  };
  toggle.addEventListener('click', () => {
    if (started) { elapsed += Date.now() - started; started = null; toggle.textContent = 'Старт'; }
    else { started = Date.now(); toggle.textContent = 'Пауза'; }
  });
  document.getElementById('timer-reset').addEventListener('click', () => {
    elapsed = 0; started = started ? Date.now() : null;
  });
  setInterval(() => {
    timerEl.textContent = fmt(elapsed + (started ? Date.now() - started : 0));
    document.getElementById('clock').textContent = new Date().toLocaleTimeString('ru-RU', { hour: '2-digit', minute: '2-digit' });
  }, 250);
</script>
</body>
</html>
